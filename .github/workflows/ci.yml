name: Project sanity checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Python files
        run: python -m py_compile mt_core.py train_all.py marian_ref.py pretrained_adaptation.py
      - name: Validate metrics JSON
        run: python -m json.tool results.json > /dev/null
      - name: Run artifact tests
        run: pytest -q
